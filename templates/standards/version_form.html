{% extends 'base.html' %}

{% block title %}إضافة إصدار معايير جديد | مجلس الاعتماد الأكاديمي{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-lg-7">
        <div class="card card-custom p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <h4 class="fw-bold text-dark mb-0">
                    <i class="fa-solid fa-code-branch text-success me-2"></i>
                    إضافة إصدار جديد لمنظومة المعايير الوطنية
                </h4>
                <a href="{% url 'standards:manage_dashboard' %}" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-right me-1"></i> عودة
                </a>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">مسار الاعتماد الأكاديمي: <span class="text-danger">*</span></label>
                    <select name="track" class="form-select" required>
                        {% for t_code, t_lbl in track_choices %}
                        <option value="{{ t_code }}">{{ t_lbl }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">عنوان الإصدار: <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" placeholder="مثال: المعايير الوطنية للتعليم الطبي المبنية على الاتحاد العالمي WFME" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">رقم الإصدار: <span class="text-danger">*</span></label>
                        <input type="text" name="version_number" class="form-control" value="1.0" placeholder="مثال: 1.0 أو 2.0" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">المجال / التخصص الدقيق:</label>
                        <input type="text" name="specialization_or_field" class="form-control" placeholder="مثال: الطب البشري والجراحة / الصيدلة / الهندسة">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">قرار اعتماد المجلس / السند القانوني:</label>
                    <input type="text" name="adoption_decree" class="form-control" placeholder="مثال: قرار مجلس الإدارة رقم (4) لسنة 2024م">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'standards:manage_dashboard' %}" class="btn btn-outline-secondary">إلغاء</a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fa-solid fa-check me-1"></i> حفظ وتسجيل الإصدار
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
